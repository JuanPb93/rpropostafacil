<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Comprovante de Adesão (Offline)</title>
<style>
  :root { --bg:#f3f4f6; --ink:#111; --muted:#555; --card:#fff; --border:#e5e7eb; }
  body { margin:0; font-family: Arial, sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 980px; margin: 18px auto; padding: 14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow:0 6px 18px rgba(0,0,0,.06); }
  h1 { margin:0 0 10px; font-size:18px; }
  h2 { margin:18px 0 12px; font-size:14px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:16px; }
  .grid3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:16px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input, select { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; font-size:14px; outline:none; }
  input[readonly] { background:#f3f5f8; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top: 12px; }
  button { border:0; border-radius:10px; padding:10px 14px; font-weight:800; cursor:pointer; background:#111827; color:#fff; }
  button.secondary { background:#6b7280; }
  button.light { background:#e5e7eb; color:#111; }
  button.printbtn{ background:#0b1220; color:#fff; }
  button.printbtn:{ opacity:.45; cursor:not-allowed; filter:saturate(.9); }

  .hint { margin-top:8px; font-size:13px; color:#666; }
  .errbox { display:none; margin-top:10px; padding:10px 12px; border-radius:10px; background:#fee2e2; border:1px solid #fecaca; color:#7f1d1d; font-size:13px; }
  .tiny { font-size:12px; color:#666; margin-top:6px; }

  /* Preview/Print */
  #printArea { display:none; }
  .a4 { width:210mm; height:297mm; margin:0 auto; background:#fff; position:relative; overflow:hidden; }
  .tplimg { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
  .overlay { position:absolute; inset:0; }

  /* bottom-left origin positioning */
  .pos { position:absolute; left: calc(var(--x) * 1%); bottom: calc(var(--y) * 1%); }
  .field {
    font-size: calc(var(--fs, 10.5) * 1pt);
    font-weight:900;
    color:#000;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:clip;
    width: calc(var(--w, 40) * 1%);
    line-height:1.05;
  }
  .mono { font-variant-numeric: tabular-nums; letter-spacing:.2px; }

  .preview-footer {
    width: 794px;
    margin: 10px auto 0 auto;
    display:none;
    justify-content:flex-start;
  }

  body.previewing .preview-footer {
    display:flex;
    justify-content:flex-start;
  }
  .preview-footer button{ margin:0; }

  .a4, .tplimg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body.previewing #printArea { display:block; }
  body.previewing #fillArea { display:none; }

  @media print {
    body { background:#fff; }
    .wrap { max-width:none; margin:0; padding:0; }
    #fillArea, .preview-footer { display:none !important; }
    #printArea { display:block !important; }
    button { display:none !important; }
  }

  /* glow simples */
  .glow-focus{ border-color:#2563eb !important; box-shadow:0 0 0 3px rgba(37,99,235,.30),0 0 12px rgba(37,99,235,.55) !important; }
  .glow-error{ border-color:#ef4444 !important; box-shadow:0 0 0 3px rgba(239,68,68,.25),0 0 12px rgba(239,68,68,.55) !important; }
  .glow-ok{ border-color:#22c55e !important; box-shadow:0 0 0 3px rgba(34,197,94,.25),0 0 12px rgba(34,197,94,.50) !important; }
  
/* ===== CALIBRAÇÃO (arrastar campos + gerar JSON) ===== */
.calib-handle{
  position:absolute; inset:-6px;
  border:2px dashed rgba(255,0,0,.75);
  border-radius:6px;
  pointer-events:auto;
  display:none;
}
.calib-resize{
  position:absolute; right:-10px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; border-radius:4px;
  background:rgba(255,122,0,.95);
  box-shadow:0 0 0 2px rgba(255,122,0,.25);
  cursor:ew-resize;
  display:none;
}
.calib-label{
  position:absolute; left:0; top:-24px;
  background:rgba(17,24,39,.92);
  color:#fff;
  font-size:12px;
  padding:4px 8px;
  border-radius:999px;
  display:none;
  pointer-events:none;
  white-space:nowrap;
}
.gridlines{ display:none; position:absolute; inset:0; pointer-events:none; }
.gridlines::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    linear-gradient(to right, rgba(255,122,0,.18) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,122,0,.18) 1px, transparent 1px);
  background-size: 10mm 10mm;
  mix-blend-mode:multiply;
}


.calib-label::before{ content: attr(data-calib-label); }

.calib-on .calib-handle,
.calib-on .calib-resize,
.calib-on .calib-label{ display:block; }
.calib-on .gridlines{ display:block; }
.calib-on .pos{ cursor:move; }

#calibPanel{
  position:fixed; right:14px; bottom:14px; width:380px;
  background:#111827; color:#fff; border-radius:12px; padding:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  display:none; z-index:9999;
}
#calibPanel .title{ font-weight:900; font-size:13px; margin-bottom:8px; }
#calibPanel .sub{ font-size:12px; color:#d1d5db; margin:6px 0 10px; line-height:1.25; }
#calibPanel textarea{
  width:100%; height:150px; resize:vertical;
  border-radius:10px; border:0; padding:10px;
  font-size:12px; outline:none;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  box-sizing:border-box;
}
#calibPanel .row2{ display:flex; gap:8px; margin-top:8px; }
#calibPanel .btn{
  flex:1; background:#e5e7eb; color:#111;
  border-radius:10px; padding:8px 10px;
  font-weight:900; cursor:pointer; text-align:center; user-select:none;
}
#calibPanel .btn.dark{ background:#374151; color:#fff; }
#calibPanel .btn.orange{ background:#ff7a00; color:#fff; }


/* ===== v50: layout + tipo em cards ===== */
.grid3{
  display:grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap:10px;
}
@media (max-width: 860px){
  .grid3{ grid-template-columns: 1fr; }
}

.optcard{
  display:flex; align-items:center; gap:10px;
  border:1px solid #d1d5db; border-radius:12px;
  padding:12px 12px; margin-top:10px;
  background:#fff;
  font-weight:900;
  cursor:pointer;
}
.optcard input{ width:18px; height:18px; cursor:pointer; }
#ativ_data{ min-height:30px; }
  .optnote{

  margin-top:10px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#f3f4f6;
  padding:6px 10px;
  font-size:12px;
  color:#111;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-height:30px;
  display:flex;
  align-items:center;
}





.sectionTitle{
  font-weight:800;
  font-size:15px;
  margin:20px 0 16px 0;
  border-bottom:1px solid #e5e7eb;
  padding-bottom:8px;
  text-transform:uppercase;
}








/* Coluna direita em 2 linhas com o mesmo gap da esquerda */
.ativ-wrap > div:last-child{
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* Padroniza altura visual (sem “engordar” os cards): mesmo padding/line-height dos inputs */
.ativ-wrap .optcard{
  box-sizing:border-box;
  padding:10px 12px;
  line-height:1.2;
  display:flex;
  align-items:center;
  min-height:42px;
}

.ativ-wrap #ativ_data{
  box-sizing:border-box;
  min-height:42px;
}

.ativ-wrap .optnote{
  box-sizing:border-box;
  margin-top:0 !important;
  padding:10px 12px;
  min-height:42px;
  display:flex;
  align-items:center;
}





/* Coluna esquerda: remove margens próprias e usa espaçamento padrão */
.ativ-wrap > div:first-child{ display:block; }
.ativ-wrap > div:first-child > label{ margin-bottom:6px; }
.ativ-wrap > div:first-child .optcard{ margin:0; width:100%; }
.ativ-wrap > div:first-child .optcard + .optcard{ margin-top:16px; }

/* Coluna direita: DATA + NOTA com o mesmo espaçamento vertical */
.ativ-wrap > div:last-child{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.ativ-wrap > div:last-child > label{ margin-bottom:6px; }
.ativ-wrap > div:last-child #ativ_data{ margin:0; }
.ativ-wrap > div:last-child .optnote{ margin:0 !important; }



/* Primeira linha */
.ativ-wrap > div:first-child .optcard:first-child{
  grid-column:1;
  grid-row:1;
}
.ativ-wrap > div:last-child #ativ_data{
  grid-column:2;
  grid-row:1;
}

/* Segunda linha */
.ativ-wrap > div:first-child .optcard:last-child{
  grid-column:1;
  grid-row:2;
}
.ativ-wrap > div:last-child .optnote{
  grid-column:2;
  grid-row:2;
  margin:0 !important;
}


/* === AJUSTE DE ALINHAMENTO (TIPO x DATA/NOTA) v36 ===
   Alinha PROGRAMADA ↔ DATA e IMEDIATA ↔ BLOCO CINZA
   sem mexer em outras seções. */
.grid.ativ-wrap { align-items:start; }

/* Harmoniza visual de PROGRAMADA/IMEDIATA com os campos da direita */
.grid.ativ-wrap > div:first-child .optcard{
  margin-top:0;                 /* remove o 10px padrão */
  padding:10px 12px;            /* igual ao input */
  border-radius:10px;           /* igual ao input */
  box-sizing:border-box;
}
.grid.ativ-wrap > div:first-child .optcard + .optcard{
  margin-top:16px;              /* mesmo espaçamento entre linhas */
}

/* Coluna direita: sem degrau */
.grid.ativ-wrap > div:last-child #ativ_data{
  margin-top:0;
  box-sizing:border-box;
}
.grid.ativ-wrap > div:last-child .optnote{
  margin-top:16px !important;   /* alinha com IMEDIATA */
  border-radius:10px;
  padding:10px 12px;
  box-sizing:border-box;
}


/* === AJUSTE DE ALINHAMENTO FORÇADO (TIPO x DATA/NOTA) v37 === */
.grid.ativ-wrap{ align-items:start; }

/* transformar as colunas em pilhas com gap idêntico */
.grid.ativ-wrap > div:first-child,
.grid.ativ-wrap > div:last-child{
  display:flex !important;
  flex-direction:column !important;
  gap:16px !important;
}

/* manter labels (Tipo/Data) fora do gap extra: zera margem do label e controla via gap */
.grid.ativ-wrap > div:first-child > label:first-child,
.grid.ativ-wrap > div:last-child > label:first-child{
  margin:0 !important;
}

/* cards PROGRAMADA/IMEDIATA: remover margem/padding herdados e igualar ao input */
.grid.ativ-wrap > div:first-child > label.optcard{
  margin:0 !important;
  padding:10px 12px !important;
  border-radius:10px !important;
  min-height:44px !important;
  box-sizing:border-box !important;
}

/* DATA e bloco cinza: mesma altura e sem degrau */
.grid.ativ-wrap > div:last-child > #ativ_data{
  margin:0 !important;
  min-height:44px !important;
  box-sizing:border-box !important;
}
.grid.ativ-wrap > div:last-child > #imed_note{
  margin:0 !important;
  min-height:44px !important;
  border-radius:10px !important;
  padding:10px 12px !important;
  box-sizing:border-box !important;
}

  .field-text{
    display:inline;
    white-space:inherit;
    pointer-events:none;
  }


/* === CORREÇÃO: NÃO CORTAR TEXTO NO DOCUMENTO (FONTE FIXA) v44 === */
.field, .field2{
  overflow: visible !important;
  text-overflow: clip !important;
  white-space: nowrap !important;
  font-size: 12px !important;
}

/* === v5: reduzir somente o campo de reajuste no visualizador/documento === */
#out_reaj{
  font-size: 11px !important;
  line-height: 1 !important;
}


/* === FIX CALIBRAÇÃO: permitir arrastar TODOS os campos === */
.calib-on .pos{ z-index: 1; }
.calib-on .field, .calib-on .field2{ position:relative; z-index:1; pointer-events:none; }
.calib-on .calib-handle{ z-index:10; }
.calib-on .calib-resize{ z-index:11; pointer-events:auto; }
.calib-on .calib-label{ z-index:12; pointer-events:none; }


/* === CALIBRAÇÃO: exibir handles para TODOS os campos (page1.calib-on) v47 === */
#page1.calib-on .calib-handle,
#page1.calib-on .calib-resize,
#page1.calib-on .calib-label{
  display:block !important;
}


/* === CALIBRAÇÃO: permitir arrastar clicando EM QUALQUER PARTE do campo === */
#page1.calib-on #overlay .pos,
#page1.calib-on #overlay .pos *{
  pointer-events:auto !important;
}


/* === v59: esconder botão MODO CALIBRAÇÃO (CSS) === */
button[onclick*="toggleCalib"]{ display:none !important; }


/* ===== v3.1 MOBILE: formulários responsivos e amigáveis ao toque ===== */
@media screen and (max-width: 960px){
  html,body{width:100%;max-width:100%;min-height:100%;overflow-x:hidden;overscroll-behavior-x:none;}
  body{background:#f3f4f6;-webkit-text-size-adjust:100%;}
  .wrap{width:100%;max-width:none;margin:0;padding:8px;}
  .card{padding:12px;border-radius:12px;box-shadow:none;}
  h1{font-size:16px;line-height:1.25;margin-bottom:12px;}
  h2{font-size:15px;line-height:1.25;margin:16px 0 10px;}
  h3{font-size:14px;line-height:1.25;}

  .grid,.grid3,.grid2,.inline-calc,.taxa-isento-wrap,.endereco-grid,
  .endereco-grid .linha2,.psc-grid,.plan-grid,.phone-row{
    grid-template-columns:minmax(0,1fr)!important;
    gap:11px!important;
  }
  .grid,.grid3{margin-bottom:12px;}
  .contrato-wrap,.cityuf{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:10px!important;}
  .contrato-wrap input,.contrato-wrap select,.cityuf input,.cityuf select{width:100%!important;max-width:none!important;flex:auto!important;}
  .numero-sn-wrap{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:8px!important;}
  .taxa-isento-wrap{align-items:stretch!important;}
  .isento-flag,.sn-flag{min-height:48px;height:auto;padding:10px 12px;}

  input:not([type="radio"]):not([type="checkbox"]),select,textarea{
    min-height:48px!important;font-size:16px!important;padding:10px 12px!important;border-radius:10px!important;
  }
  input[type="radio"],input[type="checkbox"]{min-width:20px;min-height:20px;accent-color:#ff7a00;}
  label{line-height:1.25;}
  .pill,.optcard{min-height:46px;padding:10px 11px;white-space:normal;}
  .row{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:9px!important;width:100%;}
  .row button,.preview-footer button,button{
    min-height:48px;font-size:15px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .row button{width:100%;}
  .inline-calc button{width:100%;}

  .tabs{
    position:sticky;top:0;z-index:100;display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    margin:10px -4px;padding:8px 4px;background:rgba(243,244,246,.96);backdrop-filter:blur(8px);
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{flex:1 0 auto;min-width:max-content;}
  .form-section,.dep-card,.psc-card{padding:12px;margin:10px 0;border-radius:12px;}
  .psc-line.deps{flex-wrap:wrap;white-space:normal;}
  .optnote{white-space:normal;overflow:visible;min-height:42px;}

  .errbox,.hint,.tiny{font-size:13px;line-height:1.4;}
  .email-suggest{left:8px!important;right:8px!important;width:auto!important;max-width:none!important;max-height:38dvh;}
  #calibPanel{left:8px!important;right:8px!important;bottom:8px!important;width:auto!important;max-height:82dvh;overflow:auto;}

  body.previewing{overflow:auto!important;background:#d1d5db;}
  body.previewing .wrap{padding:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  body.previewing #printArea{transform-origin:top left;margin:0!important;}
  body.previewing .preview-footer{margin-top:8px;}
}

@media screen and (max-width: 420px){
  .wrap{padding:6px;}
  .card{padding:10px;}
  .numero-sn-wrap{grid-template-columns:minmax(0,1fr)!important;}
  .sn-flag{width:100%;}
}

</style>
<!-- V2.5: labels de calibração foram movidos para data-calib-label; valores ficam separados em data-field/id. -->
</head>
<body>
<div class="wrap">

  <div id="fillArea" class="card">
    <h1>COMPROVANTE DE ADESÃO (OFFLINE) - PREENCHER CAMPOS</h1>

    
    <div class="sectionTitle">DADOS</div>

    <!-- 1. Nome -->
    <div class="grid">
      <div style="grid-column:1 / span 2;">
        <label>NOME DO BENEFICIÁRIO *</label>
        <input id="nome_benef" autocomplete="off" placeholder="DIGITE O NOME" />
      </div>
    </div>

    <!-- 2. Prestadora (linha inteira) -->
    <div class="grid">
      <div style="grid-column:1 / span 2;">
        <label>PRESTADORA *</label>
        <select id="prestadora">
          <option value="">SELECIONE…</option>
          <option value="UNIMED">UNIMED</option>
          <option value="INTERMED">INTERMED</option>
        </select>
      </div>
    </div>

    <h2>ATIVAÇÃO PREVISTA *</h2>

    <!-- 3. Plano contrato (dentro do bloco 4) -->
    <div class="grid">
      <div style="grid-column:1 / span 2;">
        <label>PLANO CONTRATO *</label>
        <select id="plano_contrato">
          <option value="">SELECIONE…</option>
          <option value="ATENDMED PLENO II">ATENDMED PLENO II</option>
          <option value="ATENDMED TOP">ATENDMED TOP</option>
          <option value="UNIMULTI EMPRESARIAL BÁSICO">UNIMULTI EMPRESARIAL BÁSICO</option>
          <option value="UNIMULTI EMPRESARIAL ESPECIAL">UNIMULTI EMPRESARIAL ESPECIAL</option>
          <option value="UNIVIDA BÁSICO">UNIVIDA BÁSICO</option>
          <option value="UNIVIDA ESPECIAL">UNIVIDA ESPECIAL</option>
        </select>
      </div>
    </div>

    <!-- Tipo + Data + bloco de texto (sempre visível) -->
    <div class="grid ativ-wrap">
      <div>
        <label>Tipo *</label>

        <label class="optcard">
          <input type="radio" name="ativ_tipo" id="ativ_prog" value="PROGRAMADA">
          <span>PROGRAMADA</span>
        </label>

        <label class="optcard">
          <input type="radio" name="ativ_tipo" id="ativ_imed" value="IMEDIATA">
          <span>IMEDIATA</span>
        </label>
      </div>

      <div>
        <label>Data (DD/MM/AAAA) *</label>
        <input id="ativ_data" inputmode="numeric" placeholder="DD/MM/AAAA" maxlength="10" />
        <div class="optnote" id="imed_note" style="color:transparent;"></div>
      </div>
    </div>

    <!-- 5. Valor -->
    <div class="grid">
      <div>
        <label>VALOR MENSAL DO PLANO (R$) *</label>
        <input id="valor_mensal" inputmode="numeric" placeholder="R$ 0,00" />
      </div>
      <div></div>
    </div>

    <!-- 6 contrato + vencimento + mês (na mesma linha) -->
    <div class="grid3">
      <div>
        <label>CONTRATO *</label>
        <select id="contrato">
          <option value="">PREENCHIDO AUTOMATICAMENTE</option>
          <option value="RESOLVE INTERMED">RESOLVE INTERMED</option>
          <option value="RESOLVE UNIMED">RESOLVE UNIMED</option>
          <option value="UNIMED - PROFESSORES">UNIMED - PROFESSORES</option>
        </select>
      </div>
      <div>
        <label>Vencimento (Dia) *</label>
        <input id="venc_dia" readonly placeholder="DIA" />
      </div>
      <div>
        <label>PERÍODO DE REAJUSTE ANUAL (Mês) *</label>
        <input id="reaj_mes" readonly placeholder="MÊS" />
      </div>
    </div>

    <!-- 8 + 9 (lado a lado) -->
    <div class="grid">
      <div>
        <label>DESISTÊNCIA DA ADESÃO (mês) (opcional)</label>
        <select id="desist_mes">
          <option value="">(NÃO INFORMAR)</option>
          <option value="JANEIRO">JANEIRO</option>
          <option value="FEVEREIRO">FEVEREIRO</option>
          <option value="MARÇO">MARÇO</option>
          <option value="ABRIL">ABRIL</option>
          <option value="MAIO">MAIO</option>
          <option value="JUNHO">JUNHO</option>
          <option value="JULHO">JULHO</option>
          <option value="AGOSTO">AGOSTO</option>
          <option value="SETEMBRO">SETEMBRO</option>
          <option value="OUTUBRO">OUTUBRO</option>
          <option value="NOVEMBRO">NOVEMBRO</option>
          <option value="DEZEMBRO">DEZEMBRO</option>
        </select>
      </div>
      <div>
        <label>DATA PORTABILIDADE (DD/MM/AAAA) (opcional)</label>
        <input id="port_data" inputmode="numeric" placeholder="DD/MM/AAAA" maxlength="10" />
      </div>
    </div>

    <!-- 10 (lado a lado) -->
    <div class="grid">
      <div>
        <label>NOME DO BENEFICIÁRIO (auto)</label>
        <input id="nome_benef_auto" readonly placeholder="SERÁ PREENCHIDO AUTOMATICAMENTE" />
      </div>
      <div>
        <label>RESPONSÁVEL RESOLVE</label>
        <select id="resp_resolve">
          <option value="SOCORRO MACHADO" selected>SOCORRO MACHADO</option>
        </select>
      </div>
    </div>

    <div id="errbox" class="errbox"></div>
</div>



<!-- Painel de Calibração -->

<script>
  const $ = (id)=>document.getElementById(id);
  const IMED_NOTE = "(+ PROPORCIONAL DE DIAS ATIVOS DE ACORDO COM VALOR DO PLANO)";
  const REAJ_NOTE = "(PODE ACONTECER ATÉ 60 DIAS APÓS O ANIVERSÁRIO DO CONTRATO*)";

  function buildReajText(month){
    const m = String(month || "").trim();
    return m ? (m + " " + REAJ_NOTE) : "";
  }


  // Ajusta o tamanho da fonte do campo do documento para caber na largura (sem cortar texto)
  function ensureFieldText(el){
    if(!el) return null;
    let span = el.querySelector(".field-text");
    if(!span){
      span = document.createElement("span");
      span.className = "field-text";
      // inserir antes do handle de calibração (se existir)
      const handle = el.querySelector(".calib-resize");
      if(handle) el.insertBefore(span, handle);
      else el.appendChild(span);
    }
    return span;
  }

  function fitField(el, text){
    if(!el) return;
    const span = ensureFieldText(el);
    if(!span) return;
    // mantém fonte padrão (não reduz)
    el.style.setProperty("--fs", 12);
    span.textContent = text || "";
  }

  function setOut(id, text){
    const el = $(id);
    if(!el) return;
    el.dataset.raw = text || "";
    fitField(el, text);
  }

  function splitDateParts(v){
    const s = String(v || "").trim();
    const m = s.match(/(\d{2})\D?(\d{2})\D?(\d{4})/);
    if(!m) return { dd:"", mm:"", aaaa:"" };
    return { dd:m[1], mm:m[2], aaaa:m[3] };
  }

  function refitAllOutputs(){ /* sem ajuste necessário */ }


  function getAtivTipo(){
    if($("ativ_prog") && $("ativ_prog").checked) return "PROGRAMADA";
    if($("ativ_imed") && $("ativ_imed").checked) return "IMEDIATA";
    return "";
  }

  function updateAtivUI(){
    const t = getAtivTipo();
    // bloco cinza sempre visível; texto só quando IMEDIATA
    if($("imed_note")) { 
      $("imed_note").textContent = IMED_NOTE; 
      $("imed_note").style.color = (t==="IMEDIATA") ? "#111" : "transparent"; 
    }

    if(t==="IMEDIATA"){
      // IMEDIATA: não digita data
      $("ativ_data").value = "";
      $("ativ_data").disabled = true;
    } else if(t==="PROGRAMADA"){
      // PROGRAMADA: habilita e permite editar a data
      $("ativ_data").disabled = false;
      $("ativ_data").focus();
    } else {
      // nenhum tipo selecionado: mantém desabilitado
      $("ativ_data").value = "";
      $("ativ_data").disabled = true;
    }
  }

    const contractItems = [
    // RESOLVE INTERMED usa vencimento e período do SISMUJOF
    ["RESOLVE INTERMED", "11", "ABRIL"],
    // RESOLVE UNIMED usa vencimento e período do SINTEPI
    ["RESOLVE UNIMED", "5", "OUTUBRO"],
    // UNIMED - PROFESSORES usa vencimento e período do SINPRO
    ["UNIMED - PROFESSORES", "6", "JANEIRO"]
  ];
  const vencMap = {};
  const reajMap = {};
  contractItems.forEach(([c,v,m])=>{ vencMap[c]=String(v); reajMap[c]=m; });
  function onlyDigits(s){ return (s||"").replace(/\D+/g,""); }

  function maskDate(el){
    let d = onlyDigits(el.value).slice(0,8);
    let out = "";
    if(d.length>=1) out = d.slice(0,2);
    if(d.length>=3) out = d.slice(0,2)+"/"+d.slice(2,4);
    if(d.length>=5) out = d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4,8);
    el.value = out;
  }

  function moneyMaskBR(el){
    let s = onlyDigits(el.value);
    if(!s) s = "0";
    // centavos: sempre 2
    s = s.replace(/^0+(?=\d)/,"");
    let v = parseInt(s,10);
    if(isNaN(v)) v = 0;
    let cents = (v % 100).toString().padStart(2,"0");
    let ints = Math.floor(v/100).toString();
    // milhar com .
    ints = ints.replace(/\B(?=(\d{3})+(?!\d))/g,".");
    el.value = "R$ " + ints + "," + cents;
  }

  function upperLive(el){
    // UPPERCASE + apenas letras/espacos + apóstrofo simples
    let v = (el.value || "").toUpperCase();

      const parts = d.split("/");

      { id:"valor_mensal", ok: ()=>isMoneyFilled($("valor_mensal").value) },
      { id:"contrato", ok: ()=>!!$("contrato").value },
      { id:"resp_resolve", ok: ()=>!!$("resp_resolve").value },
    ];

    // Requireds: vermelho (vazio) / verde (preenchido); azul no foco

      const focused = (document.activeElement === el);
      setNeonForField(el, r.ok(), focused);

    // TIPO (IMEDIATA/PROGRAMADA): só verde no selecionado; se nenhum, SEM NEON

        // sem neon
        setGlow(ativEl, null);

        // obrigatório quando programada: azul no foco, verde se válida, vermelho se inválida
        setNeonForField(ativEl, okDate(ativEl.value), ativFocused);
      }
    }

    // Optional: DESISTÊNCIA (verde quando preenchido; azul no foco; senão nada)
    const desistEl = $("desist_mes");
    if(desistEl){
      const f = (document.activeElement === desistEl);
      const filled = !!desistEl.value;
      if(f) setGlow(desistEl, "glow-focus");
      else if(filled) setGlow(desistEl, "glow-ok");
      else setGlow(desistEl, null);
    }

    // Optional (no botão): PORTABILIDADE (verde quando data completa/válida; azul no foco; senão nada)
    const portEl = $("port_data");

      const f = (document.activeElement === portEl);
      const filledOk = okDate(portEl.value);
      if(f) setGlow(portEl, "glow-focus");

function _num(v, fallback=0){
  const n = parseFloat(String(v||'').replace(',', '.'));
  return Number.isFinite(n) ? n : fallback;
}

function attachDrag(){
  const page = document.getElementById('page1');
  const overlay = document.getElementById('overlay');
  if(!page || !overlay) return;

  const getBox = ()=> page.getBoundingClientRect();

  overlay.addEventListener('mousedown', function(e){
    if(!__calibOn) return;

    // ignorar cliques no painel de calibração
    if(e.target.closest('#calibPanel')) return;

    const resizer = e.target.closest('.calib-resize');
    const pos = e.target.closest('.pos');
    if(!pos) return;

    const box = getBox();

    // RESIZE (somente pelo quadrado laranja)
    if(resizer){
      e.preventDefault();
      e.stopPropagation();
      const field = pos.querySelector('.field, .field2');
      if(!field) return;

      let startX = e.clientX;
      let startW = _num(getComputedStyle(field).getPropertyValue('--w'), 40);

      const onMove = (ev)=>{
        const dx = ev.clientX - startX;
        const nw = startW + (dx / box.width) * 100;
        field.style.setProperty('--w', Math.max(2, Math.min(100, nw)).toFixed(3));
      };
      const onUp = ()=>{
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      return;
    }

    // MOVE (clicando em qualquer parte do campo)
    e.preventDefault();
    let startX = e.clientX;
    let startY = e.clientY;
    let startPX = _num(getComputedStyle(pos).getPropertyValue('--x'));
    let startPY = _num(getComputedStyle(pos).getPropertyValue('--y'));

    const onMove = (ev)=>{
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      const nx = startPX + (dx / box.width) * 100;
      const ny = startPY - (dy / box.height) * 100;
      pos.style.setProperty('--x', Math.max(0, Math.min(100, nx)).toFixed(3));
      pos.style.setProperty('--y', Math.max(0, Math.min(100, ny)).toFixed(3));
    };
    const onUp = ()=>{
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
}

    };

  let obj;

  document.querySelectorAll('#overlay .pos').forEach(pos=>{

}

async function copiarJSON(){

  try{

  }

(function(){

  function respond(ev, data){
    try{
      ev.source.postMessage(Object.assign({__unified:true, rid: ev.data && ev.data.rid}, data || {}), '*');
    }catch(e){}
  }

  function callIfExists(name){
    try{
      var fn = window[name];
      if(typeof fn === 'function'){
        fn();

      }
    }catch(e){}
    return false;
  }

<script id="PDF_ORIGINAL_OVERLAY_BRIDGE_V26">
/* V2.6 - Bridge de extração para PDF original.
   O index.html não acessa mais document/contentDocument do iframe.
   Cada documento mede suas próprias posições e devolve somente dados simples via postMessage. */
(function(){
  if(window.__pdfOriginalOverlayBridgeV26) return;
  window.__pdfOriginalOverlayBridgeV26 = true;

  function normalizeOverlayText(text){
    return String(text || '')
      .replace(/\u00a0/g, ' ')
      .replace(/[\u200B-\u200D\uFEFF]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function isVisible(el){
    if(!el) return false;
    const cs = window.getComputedStyle(el);
    if(!cs || cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity || '1') === 0) return false;
    let cur = el.parentElement;
    while(cur){
      const ccs = window.getComputedStyle(cur);
      if(ccs && (ccs.display === 'none' || ccs.visibility === 'hidden')) return false;
      cur = cur.parentElement;
    }
    return true;
  }

  function readCleanNodeText(node){
    if(!node) return '';
    const clone = node.cloneNode(true);
    try{
      clone.querySelectorAll('.calib-label, .calib-handle, .calib-resize, .gridlines, script, style').forEach(n => n.remove());
    }catch(e){}
    return normalizeOverlayText(clone.textContent || '');
  }

  function stripInternalKeyPrefix(text, el){
    text = normalizeOverlayText(text);
    if(!text || !el) return text;
    const keys = [];
    try{ if(el.id) keys.push(el.id); }catch(e){}
    try{ if(el.getAttribute('data-key')) keys.push(el.getAttribute('data-key')); }catch(e){}
    try{ if(el.getAttribute('data-calib')) keys.push(el.getAttribute('data-calib')); }catch(e){}
    try{ if(el.getAttribute('data-calib-label')) keys.push(el.getAttribute('data-calib-label')); }catch(e){}
    try{ if(el.getAttribute('data-field')) keys.push(el.getAttribute('data-field')); }catch(e){}
    for(const k of keys){
      const key = normalizeOverlayText(k);
      if(!key) continue;
      if(text === key) return '';
      if(text.startsWith(key + ' ')) return normalizeOverlayText(text.slice(key.length));
      if(text.startsWith(key + ':')) return normalizeOverlayText(text.slice(key.length + 1));
      if(text.startsWith(key + ' - ')) return normalizeOverlayText(text.slice(key.length + 3));
    }
    return normalizeOverlayText(text.replace(/^(out_[A-Za-z0-9_\-]+)\s*/,'').replace(/^(p_[A-Za-z0-9_\-]+)\s*/,''));
  }

  function textFromPos(el){
    if(!el) return '';
    if(el.classList && el.classList.contains('mark')){
      const markText = normalizeOverlayText(el.textContent || '');
      return markText ? 'X' : '';
    }
    let field = null;
    try{
      field = el.querySelector('.field-text') ||
        ((el.matches && el.matches('.field, .field2, .field-text'))
          ? el
          : el.querySelector('.field, .field2, .field-text'));
    }catch(e){ field = null; }

    let text = readCleanNodeText(field);
    if(text) return stripInternalKeyPrefix(text, el);
    text = readCleanNodeText(el);
    return stripInternalKeyPrefix(text, el);
  }

  function getCssNumber(el, prop, fallback){
    try{
      const cs = window.getComputedStyle(el);
      const raw = cs.getPropertyValue(prop);
      const n = parseFloat(raw);
      return Number.isFinite(n) ? n : fallback;
    }catch(e){ return fallback; }
  }

  function extractOverlayPages(){
    let pageEls = Array.from(document.querySelectorAll('#printArea .a4, #printArea .A4, #printArea .sheet'));
    if(!pageEls.length) pageEls = Array.from(document.querySelectorAll('.a4, .A4, .sheet'));
    return pageEls.map((pageEl, pageIndex) => {
      const pageRect = pageEl.getBoundingClientRect();
      const items = [];
      const posEls = Array.from(pageEl.querySelectorAll('.pos'));
      for(const el of posEls){
        if(!isVisible(el)) continue;
        const text = textFromPos(el);
        if(!text) continue;
        const rect = el.getBoundingClientRect();
        if(!pageRect.width || !pageRect.height) continue;
        if(rect.right < pageRect.left || rect.left > pageRect.right || rect.bottom < pageRect.top || rect.top > pageRect.bottom) continue;

        const textEl = el.querySelector('.field, .field2, .field-text') || el;
        const tcs = window.getComputedStyle(textEl);
        let fontPx = parseFloat(tcs.fontSize || '') || getCssNumber(el, 'font-size', 12);
        let fontPt = Math.max(5, Math.min(18, fontPx * 72 / 96));
        const fontWeight = String(tcs.fontWeight || '').toLowerCase();
        const bold = fontWeight === 'bold' || parseInt(fontWeight,10) >= 600 || el.classList.contains('mark');

        const xPct = (rect.left - pageRect.left) / pageRect.width;
        const yBottomPct = (pageRect.bottom - rect.bottom) / pageRect.height;
        const wPct = rect.width > 0 ? (rect.width / pageRect.width) : 0.25;
        const baselineAdjustPt = el.classList.contains('mark') ? 1.2 : 1.6;
        items.push({
          id: el.id || el.getAttribute('data-key') || el.getAttribute('data-field') || '',
          text,
          xPct,
          yBottomPct,
          wPct,
          fontPt,
          bold,
          baselineAdjustPt,
          isMark: el.classList.contains('mark') || text === 'X'
        });
      }
      return {pageIndex, items};
    });
  }

  function respond(ev, data){
    try{
      ev.source.postMessage(Object.assign({__unified:true, rid: ev.data && ev.data.rid}, data), '*');
    }catch(e){}
  }

  window.addEventListener('message', function(ev){
    const msg = ev.data;
    if(!msg || typeof msg !== 'object') return;
    if(msg.__unified !== true) return;

    if(msg.type === 'GET_OVERLAY_PAGES_V26'){
      try{
        respond(ev, {type:'GET_OVERLAY_PAGES_V26_RESULT', ok:true, pages: extractOverlayPages()});
      }catch(e){
        respond(ev, {type:'GET_OVERLAY_PAGES_V26_RESULT', ok:false, pages: [], error: e && e.message ? e.message : String(e)});
      }
      return;
    }

    if(msg.type === 'GET_FIELD_VALUE_V26'){
      let value = '';
      try{
        const id = String(msg.fieldId || '');
        const el = id ? document.getElementById(id) : null;
        if(el){
          if(el.type === 'checkbox') value = el.checked ? (el.value || '1') : '';
          else value = String(el.value || el.textContent || '').trim();
        }
      }catch(e){}
      respond(ev, {type:'GET_FIELD_VALUE_V26_RESULT', value});
      return;
    }
  }, false);
})();
</script>


<script id="COMPROVANTE_ADESAO_MIRROR_TARGET_V31">
/* V3.1 - recebe campos espelhados da Proposta Coletivo por Adesão. */
(function(){
  if(window.__comprovanteMirrorTargetV31) return;
  window.__comprovanteMirrorTargetV31 = true;

  function $(id){ return document.getElementById(id); }
  function ensureStyle(){
    if(document.getElementById('mirrorLockedStyleV31')) return;

    document.head.appendChild(st);

  function onlyDigits(v){ return String(v || '').replace(/\D+/g, ''); }
  function normalize(v){ return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim(); }
  const PLAN_MAP = {

    '5361':'ACIP', '4677':'ADCESP', '4691':'ASSIFPI', '5446':'CAU', '5621':'CDL', '5580':'CRECI',
    '4709':'CRF', '5562':'CRMV', '4572':'FESPPI', '5392':'SENATEPI', '4599':'SINDEPOL', '5841':'SINPRO',
    '4903':'SINSEP', '4970':'SINTEPI', '4690':'SINTUFPI'
  };
  const CONTRACT_DEP_V31 = {
    'RESOLVE INTERMED':['11','ABRIL'], 'RESOLVE UNIMED':['5','OUTUBRO'], 'UNIMED - PROFESSORES':['6','JANEIRO'],
    'ACIP INTERMED':['11','NOVEMBRO'], 'ASSIFPI INTERMED':['11','MARÇO'], 'SINTUFPI INTERMED':['11','ABRIL'], 'SISMUJOF':['11','ABRIL'],
    'ACIP':['7','FEVEREIRO'], 'ADCESP':['20','JANEIRO'], 'ASSIFPI':['5','OUTUBRO'], 'CAU':['5','ABRIL'], 'CDL':['7','AGOSTO'],
    'CRECI':['10','JULHO'], 'CRF':['5','JULHO'], 'CRMV':['9','JULHO'], 'FESPPI':['10','OUTUBRO'], 'SENATEPI':['9','MARÇO'],
    'SINDEPOL':['19','JANEIRO'], 'SINPRO':['6','JANEIRO'], 'SINSEP':['5','JULHO'], 'SINTEPI':['5','OUTUBRO'], 'SINTUFPI':['5','SETEMBRO']
  };
  function buildReajTextV31(month){
    const m = String(month || '').trim();
    return m ? (m + ' (PODE ACONTECER ATÉ 60 DIAS APÓS O ANIVERSÁRIO DO CONTRATO*)') : '';
  }
  function lockInput(id, lock=true){
    const el = $(id);
    if(!el) return;
    el.readOnly = !!lock;
    el.tabIndex = lock ? -1 : 0;
    el.classList.toggle('mirror-locked-v31', !!lock);
    if(lock) el.title = 'Campo espelhado da PROPOSTA COLETIVO POR ADESÃO. Para alterar, edite na Proposta.';
    else el.title = '';
  }
  function lockSelect(id, lock=true){
    const el = $(id);
    if(!el) return;
    el.disabled = !!lock;
    el.tabIndex = lock ? -1 : 0;
    el.classList.toggle('mirror-locked-v31', !!lock);
    if(lock) el.title = 'Campo espelhado da PROPOSTA COLETIVO POR ADESÃO. Para alterar, edite na Proposta.';
    else el.title = '';
  }
  function lockRadio(id, lock=true){
    const el = $(id);
    if(!el) return;
    el.disabled = !!lock;
    el.tabIndex = lock ? -1 : 0;

    if(lock) el.title = 'Campo espelhado da PROPOSTA COLETIVO POR ADESÃO. Para alterar, edite na Proposta.';
    else el.title = '';
  }
  function unlockExceptions(programada){
    lockSelect('desist_mes', false);
    lockInput('port_data', false);
    const data = $('ativ_data');
    if(data){
      data.disabled = !programada;
      data.readOnly = !programada;
      data.tabIndex = programada ? 0 : -1;
      data.classList.toggle('mirror-locked-v31', !programada);
      data.title = programada ? '' : 'A data só libera quando a movimentação programada for escolhida na Proposta.';
    }
  }
  function lockMirroredFields(programada){
    ensureStyle();
    lockInput('nome_benef', true);
    lockSelect('prestadora', true);
    lockSelect('plano_contrato', true);
    lockRadio('ativ_prog', true);
    lockRadio('ativ_imed', true);
    lockInput('valor_mensal', true);
    lockSelect('contrato', true);
    lockInput('nome_benef_auto', true);
    lockSelect('resp_resolve', true);
    unlockExceptions(!!programada);
  }
  function setInput(id, value){
    const el = $(id);
    if(!el) return;
    const next = String(value || '');
    if(el.value !== next) el.value = next;
  }
  function ensureSelectOption(sel, value){
    if(!sel || !value) return;
    const found = Array.from(sel.options || []).some(o => o.value === value);
    if(!found){
      const o = document.createElement('option');
      o.value = value;
      o.textContent = value;
      sel.appendChild(o);
    }
  }
  function setSelect(id, value){
    const sel = $(id);
    if(!sel) return;
    const next = String(value || '');
    ensureSelectOption(sel, next);
    if(sel.value !== next) sel.value = next;
  }
  function resolvePlan(data){
    const raw = data.nomePlano || data.nomePlanoTexto || '';
    const key = normalize(raw);
    const mapped = PLAN_MAP[key] || raw;
    const sel = $('plano_contrato');
    if(sel && mapped){
      const exact = Array.from(sel.options || []).find(o => o.value === mapped);
      if(exact) return exact.value;
      const byNorm = Array.from(sel.options || []).find(o => normalize(o.value) === normalize(mapped) || normalize(o.textContent) === normalize(mapped));
      if(byNorm) return byNorm.value;
    }
    return mapped || '';
  }
  function resolvePrestadora(data){
    const contrato = normalize(data.contratoTexto || data.contratoValor || '');
    if(contrato === 'RESOLVE INTERMED') return 'INTERMED';
    if(contrato === 'RESOLVE UNIMED') return 'UNIMED';
    if(contrato === 'UNIMED - PROFESSORES') return 'UNIMED';
    return '';
  }
  function resolveContract(data){
    const raw = data.contratoTexto || data.contratoValor || '';
    const key = normalize(raw);
    if(key === 'RESOLVE INTERMED') return 'RESOLVE INTERMED';
    if(key === 'RESOLVE UNIMED') return 'RESOLVE UNIMED';
    if(key === 'UNIMED - PROFESSORES') return 'UNIMED - PROFESSORES';
    const num = onlyDigits(data.contratoValor || '');
    if(num && CONTRACT_MAP[num]) return CONTRACT_MAP[num];
    return raw || '';
  }
  function dispatchChange(id){
    const el = $(id);
    if(!el) return;
    try{ el.dispatchEvent(new Event('change', {bubbles:true})); }catch(e){}
  }
  function applyContratoDependentes(){
    dispatchChange('contrato');
    const c = $('contrato') ? $('contrato').value : '';
    const dep = CONTRACT_DEP_V31[c];
    if(dep){
      if($('venc_dia')) $('venc_dia').value = dep[0] || '';
      if($('reaj_mes')) $('reaj_mes').value = buildReajTextV31(dep[1] || '');
    }else{
      if($('venc_dia')) $('venc_dia').value = '';
      if($('reaj_mes')) $('reaj_mes').value = '';
    }
  }
  function setMovement(tipo){
    const prog = $('ativ_prog');
    const imed = $('ativ_imed');
    if(prog) prog.checked = tipo === 'PROGRAMADA';
    if(imed) imed.checked = tipo === 'IMEDIATA';
    if(tipo !== 'PROGRAMADA') setInput('ativ_data', '');
    try{ if(typeof updateAtivUI === 'function') updateAtivUI(); }catch(e){}
  }
  function applyMirror(data){
    data = data || {};
    const tipo = data.movimentacaoTipo || '';
    const programada = tipo === 'PROGRAMADA';

    setInput('nome_benef', data.nomeTitular || '');
    setInput('valor_mensal', data.valorPlano || '');
    setSelect('resp_resolve', 'SOCORRO MACHADO');
    setSelect('prestadora', resolvePrestadora(data));
    setSelect('plano_contrato', resolvePlan(data));
    setSelect('contrato', resolveContract(data));
    applyContratoDependentes();
    setMovement(tipo);
    lockMirroredFields(programada);
    if(!programada) setInput('ativ_data', '');

    try{ if(typeof syncOutputs === 'function') syncOutputs(); }catch(e){}
    try{ if(typeof validate === 'function') validate(false); }catch(e){}
  }
  window.addEventListener('message', function(ev){
    const msg = ev.data;
    if(!msg || typeof msg !== 'object' || msg.__mirrorV31 !== true) return;
    if(msg.type === 'APPLY_PROPOSTA_MIRROR_V31') applyMirror(msg.data || {});
  }, false);
  function ready(){
    setSelect('resp_resolve', 'SOCORRO MACHADO');
    lockMirroredFields(false);
    try{ window.parent && window.parent.postMessage({__mirrorV31:true, type:'MIRROR_TARGET_READY_V31', docId:'comprov'}, '*'); }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
  else ready();
})();
</script>


<script id="COMPROVANTE_ADESAO_MICRO_AJUSTE_V33">

(function(){

    if(parts.length !== 3) return false;
    const di = parseInt(parts[0], 10), mi = parseInt(parts[1], 10), yi = parseInt(parts[2], 10);

  const SELECT_TEXT_FIELDS = [

  function ensureStyle(){
    if($('microAjusteV32Style')) return;
    const st = document.createElement('style');
    st.id = 'microAjusteV32Style';
    st.textContent = `
      .mirror-select-internal-v32{display:none!important;}
      .mirror-display-v32{
        width:100%; box-sizing:border-box; padding:10px 12px;
        border:1px solid #d1d5db; border-radius:10px; font-size:14px; outline:none;
        background:#f3f4f6!important; color:#1f2937!important;
        cursor:not-allowed!important; opacity:1!important;
      }
      .mirror-display-v32::placeholder{color:#9ca3af;}
    `;
    document.head.appendChild(st);
  }

  function getSelectedText(sel){
    if(!sel || !sel.value) return '';
    const opt = sel.options && sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex] : null;
    return (opt && (opt.textContent || opt.value)) ? String(opt.textContent || opt.value).trim() : String(sel.value || '').trim();
  }

  function ensureDisplayForSelect(id, placeholder){
    const sel = $(id);
    if(!sel) return null;
    ensureStyle();
    sel.classList.add('mirror-select-internal-v32');
    sel.setAttribute('aria-hidden', 'true');
    let display = $(id + '_display_v32');
    if(!display){
      display = document.createElement('input');
      display.type = 'text';
      display.id = id + '_display_v32';
      display.className = 'mirror-display-v32';
      display.readOnly = true;
      display.tabIndex = -1;
      display.placeholder = placeholder || 'Preenchido automaticamente pela Proposta';
      display.title = 'Campo espelhado da PROPOSTA COLETIVO POR ADESÃO. Para alterar, edite na Proposta.';
      sel.insertAdjacentElement('afterend', display);
    }
    display.value = getSelectedText(sel);
    clearGlow(display);
    return display;
  }

  function updateTextDisplays(){
    SELECT_TEXT_FIELDS.forEach(cfg => ensureDisplayForSelect(cfg.id, cfg.placeholder));
  }

  function clearNonManualNeons(){
    FIELDS_WITHOUT_NEON.forEach(id => clearGlow($(id)));
    SELECT_TEXT_FIELDS.forEach(cfg => clearGlow($(cfg.id + '_display_v32')));
    document.querySelectorAll('.ativ-wrap .optcard').forEach(clearGlow);
  }

  function applyManualNeonsOnly(){
    updateTextDisplays();
    clearNonManualNeons();

    const tipo = (typeof window.getAtivTipo === 'function') ? window.getAtivTipo() : '';
    const ativEl = $('ativ_data');
    if(ativEl){
      if(tipo === 'PROGRAMADA'){
        const focused = document.activeElement === ativEl;
        if(focused) setGlowLocal(ativEl, 'glow-focus');
        else setGlowLocal(ativEl, okDate(ativEl.value) ? 'glow-ok' : 'glow-error');
      }else{
        clearGlow(ativEl);
      }
    }

    // V3.3: opcionais destacados em azul enquanto vazios/incompletos e verdes quando preenchidos.
    // Nunca recebem neon vermelho, pois não participam da validação obrigatória.
    const desistEl = $('desist_mes');
    if(desistEl){
      const filled = !!desistEl.value;
      setGlowLocal(desistEl, filled ? 'glow-ok' : 'glow-focus');
    }

    const portEl = $('port_data');
    if(portEl){
      const valid = okDate(portEl.value);
      setGlowLocal(portEl, valid ? 'glow-ok' : 'glow-focus');
    }
  }

  const originalSyncOutputs = window.syncOutputs;
  if(typeof originalSyncOutputs === 'function'){
    window.syncOutputs = function(){
      const result = originalSyncOutputs.apply(this, arguments);
      applyManualNeonsOnly();
      return result;
    };
  }

  window.updateRequiredNeon = function(){
    const tipo = (typeof window.getAtivTipo === 'function') ? window.getAtivTipo() : '';
    const reqOk = [
      !!($('nome_benef') && $('nome_benef').value.trim()),
      !!($('prestadora') && $('prestadora').value),
      !!($('plano_contrato') && $('plano_contrato').value),
      isMoneyFilled($('valor_mensal') ? $('valor_mensal').value : ''),
      !!($('contrato') && $('contrato').value),
      !!($('resp_resolve') && $('resp_resolve').value)
    ];
    const ativOk = tipo === 'PROGRAMADA' ? okDate($('ativ_data') ? $('ativ_data').value : '') : true;
    const allOk = reqOk.every(Boolean) && !!tipo && ativOk;
    applyManualNeonsOnly();
    const btn = $('btn_print');
    if(btn) btn.disabled = !allOk;
    return allOk;
  };

  function ready(){
    updateTextDisplays();
    applyManualNeonsOnly();
    try{ if(typeof window.validate === 'function') window.validate(false); }
    catch(e){ try{ window.updateRequiredNeon(); }catch(_e){} }
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
  else ready();
})();
</script>


<script>
/* ===== v3.1 MOBILE: escala automática da prévia A4 ===== */
(() => {
  const MOBILE_MAX = 960;
  const A4_WIDTH_PX = 794;
  const printArea = document.getElementById('printArea');
  if(!printArea) return;

  function syncMobilePreview(){
    const mobile = window.innerWidth <= MOBILE_MAX;
    const previewing = document.body.classList.contains('previewing');
    if(mobile && previewing){
      const scale = Math.min(1, Math.max(0.32, (window.innerWidth - 16) / A4_WIDTH_PX));
      if('zoom' in printArea.style){
        printArea.style.zoom = String(scale);
        printArea.style.width = A4_WIDTH_PX + 'px';
        printArea.style.transform = '';
      }else{
        printArea.style.zoom = '';
        printArea.style.width = A4_WIDTH_PX + 'px';
        printArea.style.transform = `scale(${scale})`;
      }
    }else{
      printArea.style.zoom = '';
      printArea.style.width = '';
      printArea.style.transform = '';
    }
  }

  new MutationObserver(syncMobilePreview).observe(document.body,{attributes:true,attributeFilter:['class']});
  window.addEventListener('resize',syncMobilePreview,{passive:true});
  window.addEventListener('orientationchange',syncMobilePreview,{passive:true});
  syncMobilePreview();
})();
</script>
